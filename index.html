<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get Coins More</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
    <script type="importmap">
      {
        "imports": {
          "@babylonjs/lite": "https://cdn.jsdelivr.net/npm/@babylonjs/lite@1.28.0/dist/index.js"
        }
      }
    </script>
    <script type="module" src="./main.js" defer></script>
  </head>
  <body>
    <canvas id="renderCanvas" ></canvas>

    <div id="ui">
      <div id="turn">
        <p>
          There are <span id="coinCount"></span> coins. Get first?
        </p>
          <div class="buttons">
            <button id="first">Yes</button>
            <button id="second">No</button>
          </div>
      </div>
    </div>
  </body>
</html>
